<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        .navbar {
            background-color: #4CAF50;
            padding: 15px;
            color: white;
            font-size: 22px;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        h2 {
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 16px;
            border: none;
        }

        button:hover {
            background-color: #45a049;
        }

        .expense-item {
            background: #f0f0f0;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .delete-btn {
            background: red;
            padding: 6px 10px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: darkred;
        }

        .total-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background: #2196F3;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }

        .total-btn:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>

<div class="navbar">💰 Expense Tracker</div>

<div class="container">

    <h2>Add Expense</h2>

    <form method="POST" action="/add">
        <label>Date</label>
        <input type="text" name="date" placeholder="DD-MM-YYYY" required>

        <label>Category</label>
        <input type="text" name="category" placeholder="Food, Travel, Shopping..." required>

        <label>Description</label>
        <input type="text" name="description" placeholder="Details..." required>

        <label>Amount</label>
        <input type="number" step="0.01" name="amount" placeholder="Enter amount" required>

        <button type="submit">Add Expense</button>
    </form>

    <h2>All Expenses</h2>

    {% if expenses %}
        {% for e in expenses %}
        <div class="expense-item">
            <strong>Date:</strong> {{ e.date }} <br>
            <strong>Category:</strong> {{ e.category }} <br>
            <strong>Description:</strong> {{ e.description }} <br>
            <strong>Amount:</strong> ₹{{ e.amount }} <br><br>

            <!-- Delete Button -->
            <a href="/delete/{{ loop.index0 }}" class="delete-btn">Delete</a>
        </div>
        {% endfor %}
    {% else %}
        <p>No expenses added yet.</p>
    {% endif %}

   
    <a href="/total" class="total-btn">View Total Expense →</a>

</div>

</body>
</html>
