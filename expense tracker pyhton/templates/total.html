<!DOCTYPE html>
<html>
<head>
    <title>Total Expense</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #4CAF50, #2E8B57);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 420px;
            background: white;
            padding: 40px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.25);
            animation: slideDown 0.7s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-40px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        .title {
            font-size: 30px;
            font-weight: bold;
            color: #333;
        }

        .amount-box {
            margin-top: 20px;
            background: #f3fff5;
            padding: 20px;
            border-radius: 12px;
            border-left: 6px solid #4CAF50;
            box-shadow: inset 0px 0px 10px rgba(76, 175, 80, 0.2);
        }

        .amount-label {
            font-size: 18px;
            color: #555;
        }

        .amount-value {
            font-size: 42px;
            font-weight: 700;
            color: #2E8B57;
            margin-top: 8px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #2196F3;
            color: white;
            text-decoration: none;
            font-size: 17px;
            border-radius: 8px;
            transition: 0.3s ease-in-out;
            box-shadow: 0px 4px 12px rgba(33, 150, 243, 0.4);
        }

        .back-btn:hover {
            background: #0a7bd6;
            transform: translateY(-3px);
        }

    </style>
</head>
<body>

<div class="box">
    <div class="title">📊 Total Expense Summary</div>

    <div class="amount-box">
        <div class="amount-label">Your Total Spending</div>
        <div class="amount-value">₹{{ total }}</div>
    </div>

    <a class="back-btn" href="/">← Back to Dashboard</a>
</div>

</body>
</html>
